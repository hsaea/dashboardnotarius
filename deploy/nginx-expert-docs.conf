# Reverse-proxy для Expert-Docs. Покласти у /etc/nginx/sites-available/expert-docs
# і зробити symlink у sites-enabled. Замініть dashboard.example.com на свій домен.
#
# HTTPS додасть certbot автоматично (див. DEPLOY.md), переписавши цей файл:
#   sudo certbot --nginx -d dashboard.example.com

server {
    listen 80;
    server_name dashboard.example.com;

    # Обмеження розміру тіла запиту
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
